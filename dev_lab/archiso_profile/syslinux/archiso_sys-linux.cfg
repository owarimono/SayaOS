LABEL sayaos
TEXT HELP
Boot the SayaOS Live Environment on BIOS.
Run applications in isolated jails with the SayaOS package manager.
ENDTEXT
MENU LABEL SayaOS Live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

LABEL sayaos-safe
TEXT HELP
SayaOS Live (safe graphics mode)
ENDTEXT
MENU LABEL SayaOS Live (%ARCH%, BIOS, ^safe graphics)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset

LABEL sayaos-speech
TEXT HELP
SayaOS Live with speakup screen reader
ENDTEXT
MENU LABEL SayaOS Live (%ARCH%, BIOS, ^speech)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on
