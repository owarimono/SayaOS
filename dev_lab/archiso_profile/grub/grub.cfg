insmod all_video
insmod gzio
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660

set default=0
set timeout=15

menuentry "SayaOS Live (x86_64)" {
    search --no-floppy --fs-uuid --set=root ${ARCHISO_UUID}
    linux /sayaos/boot/x86_64/vmlinuz-linux archisobasedir=sayaos archisosearchuuid=${ARCHISO_UUID} nomodeset
    initrd /sayaos/boot/x86_64/initramfs-linux.img
}

menuentry "Boot from local disk" {
    exit
}
