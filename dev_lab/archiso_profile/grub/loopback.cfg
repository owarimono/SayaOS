# SayaOS Loopback GRUB Config
# For booting ISO from an existing GRUB installation

search --no-floppy --set=archiso_img_dev --file "${iso_path}"
probe --set archiso_img_dev_uuid --fs-uuid ${archiso_img_dev}

if [ "${grub_platform}" == 'efi' ]; then
    sayaos_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    sayaos_platform='BIOS'
else
    sayaos_platform="${grub_cpu}-${grub_platform}"
fi

default=sayaos
timeout=10
timeout_style=menu

menuentry "SayaOS Live (%ARCH%, ${sayaos_platform})" --class sayaos --class gnu-linux --class gnu --class os --id 'sayaos' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' -a -f '/boot/memtest86+/memtest.efi' ]; then
        menuentry 'Run Memtest86+ (RAM test)' --class memtest86 --class memtest --class gnu --class tool {
            set gfxpayload=800x600,1024x768
            linux /boot/memtest86+/memtest.efi
        }
    fi
    menuentry 'UEFI Shell' --class efi {
        chainloader /shellx64.efi
    }
    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}

menuentry 'System restart' --class reboot --class restart {
    echo 'System restarting...'
    reboot
}
